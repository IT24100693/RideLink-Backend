name: Build and Test Services

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Maven Services
      run: |
        find . -name "mvnw" -exec chmod +x {} \;
        find . -name "pom.xml" -execdir ./mvnw clean package -DskipTests \;
